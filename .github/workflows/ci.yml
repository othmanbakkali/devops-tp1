name: CI

on:
  push:
  pull_request:

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter les tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire l'image Docker
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mon-projet-python:latest .

      - name: Démarrer le conteneur
        run: |
          docker run -d \
            --name mon-projet-python \
            -p 5000:5000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/mon-projet-python:latest

      - name: Attendre le démarrage de Flask
        run: |
          sleep 5

      - name: Vérifier l'application
        run: |
          curl --fail http://localhost:5000

      - name: Afficher les logs Docker
        if: always()
        run: |
          docker logs mon-projet-python

      - name: Arrêter le conteneur
        if: always()
        run: |
          docker stop mon-projet-python || true
          docker rm mon-projet-python || true

      - name: Publier sur Docker Hub
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/mon-projet-python:latest